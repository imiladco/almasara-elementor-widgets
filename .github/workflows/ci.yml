name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # پایین‌ترین نسخهٔ پشتیبانی‌شده تا جدیدترین پایدار
        php: ['7.4', '8.1', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring
          coverage: none
          tools: cs2pr

      - name: بررسی نحوی همهٔ فایل‌های PHP
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: تست‌های واحد
        run: php tests/run.php

  integration:
    name: یکپارچه با ووکامرس (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # درایور SQLite یعنی نیازی به سرویس دیتابیس نیست
          extensions: dom, libxml, mbstring, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - name: نصب وردپرس و ووکامرس
        run: bash tests/integration/setup.sh "$RUNNER_TEMP/wpint"

      - name: اجرای تست‌های یکپارچه
        run: WP_ROOT="$RUNNER_TEMP/wpint/wp" php tests/integration/run.php

  e2e:
    name: مرورگری (المنتور + ووکامرس)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, mbstring, sqlite3, pdo_sqlite, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب وردپرس، ووکامرس و المنتور
        run: |
          bash tests/integration/setup.sh "$RUNNER_TEMP/wpint"
          bash tests/e2e/setup.sh "$RUNNER_TEMP/wpint"

      - name: نصب مرورگر
        run: npm i -D playwright && npx playwright install --with-deps chromium

      - name: اجرای تست مرورگری
        run: WP_ROOT="$RUNNER_TEMP/wpint/wp" node tests/e2e/run.mjs

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: بررسی نحوی
        run: for f in assets/js/*.js; do node --check "$f"; done

      - name: ESLint
        run: npx --yes eslint assets/js --no-config-lookup -c eslint.config.mjs

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
          tools: phpcs, cs2pr

      - name: نصب استانداردهای وردپرس
        run: |
          composer global require --no-interaction --quiet \
            wp-coding-standards/wpcs:^3 \
            dealerdirect/phpcodesniffer-composer-installer:^1
          phpcs --config-set installed_paths ~/.composer/vendor/wp-coding-standards/wpcs

      - name: PHPCS
        run: phpcs -q --report=checkstyle | cs2pr
        continue-on-error: true
